# @package _global_

defaults:
  - /monty: evidencegraph_exp1000_emin_t3_tot2500
  - /monty/motor_system_config: distant_5_no_jump_to_goal
  - /monty/learning_module: evidence_9lm_burst_gsg1
  - /monty/sensor_module: 9sm_camera_dist_vocus2_slic
  - /monty/connectivity: 9lm_9sm
  - /environment: mujoco_ycb_dist_agent_256_sensors9
  - /env_interface: eval_fate_attenzione
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_256_sensor9
  - /logging: basic_info_monty_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: true
    max_train_steps: 1000
    max_eval_steps: 100
    max_total_steps: 100
    n_train_epochs: 3
    n_eval_epochs: 1
    model_name_or_path: ${constants.pretrained_dir}/surf_agent_1lm_10distinctobj/pretrained/
    min_lms_match: 1
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    logging:
      run_name: potato_9
      detailed_save_per_episode: true
    monty_config:
      sensor_modules:
        sensor_module_0:
          save_raw_obs: false
        sensor_module_1:
          save_raw_obs: false
        sensor_module_2:
          save_raw_obs: false
        sensor_module_3:
          save_raw_obs: false
        sensor_module_4:
          save_raw_obs: false
        sensor_module_5:
          save_raw_obs: false
        sensor_module_6:
          save_raw_obs: false
        sensor_module_7:
          save_raw_obs: false
        sensor_module_8:
          save_raw_obs: false
        sensor_module_9:
          save_raw_obs: true
      monty_args:
        copy_lm_0_to_all_lms: true
        attention_system: true
